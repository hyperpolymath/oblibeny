version: 2
updates:
  # GitHub Actions — the only package ecosystem actually present in this
  # repo (OCaml/opam, Zig, and Idris2 are not dependabot ecosystems).
  # The previous template listed npm/pip/cargo/gomod/nuget/composer for
  # stacks that do not exist here (several are policy-banned outright);
  # the stray nuget entry fed GitHub's automatic .NET dependency
  # submission, which failed on every push ("No .NET project files").
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch this ecosystem into a single PR. Ungrouped, Dependabot
    # opens one PR per dependency, and each PR re-fires every
    # workflow in the repo.
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # HOLD: github/codeql-action at v4.38.0. v4.38.1 fails GitHub
      # workflow-startup validation estate-wide (nexia-list#100) — a merged
      # bump startup-kills codeql.yml and semgrep.yml with zero jobs. This
      # exact gap let PR #136 bump 4.38.0 -> 4.38.1 on 2026-09-27 and break
      # both workflows; #135 had fixed the same breakage five days earlier.
      #
      # The trailing * is load-bearing. Workflows reference the SUBPATH
      # actions (github/codeql-action/init, /analyze, /upload-sarif) and
      # Dependabot treats each subpath as its own dependency name — a bare
      # "github/codeql-action" entry matches NONE of them. Mirrors the hold
      # in hyperpolymath/standards/.github/dependabot.yml; lift BOTH together,
      # deliberately, when upstream clears 4.38.1 or a newer release verifies
      # green estate-wide.
      - dependency-name: "github/codeql-action*"
